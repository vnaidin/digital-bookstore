name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BE_URL: ${{ secrets.VITE_BE_URL }}
          VITE_LIQ_PAY_PUBLIC: ${{ secrets.VITE_LIQ_PAY_PUBLIC }}
          VITE_LIQ_PAY_PRIVATE: ${{ secrets.VITE_LIQ_PAY_PRIVATE }}
          VITE_BOT_ID: ${{ secrets.VITE_BOT_ID }}
          VITE_CHAT_ID: ${{ secrets.VITE_CHAT_ID }}

  server:
    name: Server — lint / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # - name: Build
      #   run: npm run build
