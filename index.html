<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fallback title shown before JS hydrates -->
  <title>Alineabooks — Книжковий інтернет-магазин</title>
  <meta name="author" content="Alineabooks" />

  <!-- hreflang is site-level and static — correct place for it -->
  <link rel="alternate" hreflang="uk" href="https://alineabooks.com/uk/" />
  <link rel="alternate" hreflang="en" href="https://alineabooks.com/en/" />
  <link rel="alternate" hreflang="x-default" href="https://alineabooks.com/uk/" />

  <!-- Declares the Twitter card format; other twitter: tags are set per-page by Page component -->
  <meta name="twitter:card" content="summary" />

  <!-- PWA / Icons -->
  <link rel="icon" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#e7d6cc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Alineabooks" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@1,900&display=swap" rel="stylesheet" />

  <!-- Organization structured data — site-level, not per-page -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BookStore",
    "name": "Alineabooks",
    "url": "https://alineabooks.com",
    "logo": "https://alineabooks.com/logo512.png",
    "description": "Книжковий інтернет-магазин — найкращий асортимент, низькі ціни, новинки та бестселери.",
    "telephone": "+380636320017",
    "areaServed": "UA",
    "availableLanguage": ["Ukrainian", "English"],
    "sameAs": []
  }
  </script>
</head>

<body>
  <noscript>Для роботи цього сайту необхідно увімкнути JavaScript. / You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
